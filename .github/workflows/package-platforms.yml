name: Platform Packages and Persistence Spike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package and test ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: showflow-macos-arm64
          - runner: windows-2025
            artifact: showflow-windows-x64
          - runner: ubuntu-24.04
            artifact: showflow-linux-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pinned Node and pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          version: 11.4.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package application
        run: pnpm package

      - name: Run packaged node:sqlite spike
        if: runner.os != 'Linux'
        run: pnpm test:spike:node-sqlite
        env:
          SHOWFLOW_SPIKE_EVIDENCE_DIRECTORY: test-results/persistence-spike

      - name: Run packaged node:sqlite spike on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:spike:node-sqlite
        env:
          SHOWFLOW_SPIKE_EVIDENCE_DIRECTORY: test-results/persistence-spike

      - name: Upload node:sqlite spike evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}-node-sqlite-spike
          path: test-results/persistence-spike/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload nonrelease package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/out/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
